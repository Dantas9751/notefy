[package]
name = "notefy"
version = "1.2.0"
description = "Notefy — notas, arquivos, planilhas, diagramas e planner"
authors = ["Notefy"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Abre o "Salvar como" nativo. Só o lado Rust é usado: quem grava o arquivo
# e o comando `salvar_arquivo` em lib.rs, e nao o plugin `fs` a partir do
# JavaScript — este ultimo exigiria abrir o escopo de escrita para todo o
# disco, ja que o caminho so e conhecido depois que o usuario escolhe.
tauri-plugin-dialog = "2"

# Sobe o backend empacotado como processo filho. Só no desktop: o Android
# não executa um `.exe` ao lado do app, e lá a SPA fala com o servidor na
# nuvem (ver `tauri.android.conf.json`).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-shell = "2"
# Uma janela só: abrir o atalho de novo traz a que já está aberta. Duas
# instâncias disputavam a porta do backend, e fechar a primeira matava o
# backend que a segunda estava usando.
tauri-plugin-single-instance = "2"

# O controle de mídia do sistema (o que está tocando, tocar/pausar), para o
# bloco do relógio no Início. A mesma versão que o Tauri já compila.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Media_Control", "Foundation"] }
